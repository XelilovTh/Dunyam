<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Premium Helix Scroll</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="particles"></canvas>
    <div class="bg-dots"></div>
    <div class="scene">
        <div class="gallery">
            <div class="pillar-container">
                <!-- Prismatic Shard Core -->
                <div class="shard-system">
                    <div class="shard shard-1"></div>
                    <div class="shard shard-2"></div>
                    <div class="shard shard-3"></div>
                    <div class="shard shard-4"></div>
                    <div class="shard shard-5"></div>
                </div>
                <div class="light-beam"></div>
                <div class="pillar-glow"></div>
            </div>


            
            <div class="card"><video src="https://res.cloudinary.com/dojz9uzhe/video/upload/q_auto,f_auto,w_720/video1.mp4" loop playsinline preload="none"></video></div>
            <div class="card"><video src="https://res.cloudinary.com/dojz9uzhe/video/upload/q_auto,f_auto,w_720/video2.mp4" loop playsinline preload="none"></video></div>
            <div class="card"><video src="https://res.cloudinary.com/dojz9uzhe/video/upload/q_auto,f_auto,w_720/video3.mp4" loop playsinline preload="none"></video></div>
            <div class="card"><video src="https://res.cloudinary.com/dojz9uzhe/video/upload/q_auto,f_auto,w_720/video4.mp4" loop playsinline preload="none"></video></div>
            <div class="card"><video src="https://res.cloudinary.com/dojz9uzhe/video/upload/q_auto,f_auto,w_720/video5.mp4" loop playsinline preload="none"></video></div>
            <div class="card"><video src="https://res.cloudinary.com/dojz9uzhe/video/upload/q_auto,f_auto,w_720/video6.mp4" loop playsinline preload="none"></video></div>
            <div class="card"><video src="https://res.cloudinary.com/dojz9uzhe/video/upload/q_auto,f_auto,w_720/video7.mp4" loop playsinline preload="none"></video></div>
            <div class="card"><video src="https://res.cloudinary.com/dojz9uzhe/video/upload/q_auto,f_auto,w_720/video8.mp4" loop playsinline preload="none"></video></div>

        </div>
    </div>


    <div class="scroll-space"></div>

    <script src="script.js"></script>
</body>
</html>
