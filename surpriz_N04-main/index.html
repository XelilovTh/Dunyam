<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Premium Helix Scroll</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Premium Preloader -->
    <div id="preloader">
        <div class="loader-content">
            <div class="loader-heart">
                <i class="fas fa-heart"></i>
                <div class="heart-ring"></div>
            </div>
            <div class="loader-text">Dünyamız yüklənir...</div>
            <div class="loader-bar-container">
                <div id="loader-bar"></div>
            </div>
            <div class="loader-status"><span id="loaded-count">0</span> / 8 video</div>
        </div>
    </div>

    <canvas id="particles"></canvas>
    <div class="bg-dots"></div>
    <div class="scene">
        <div class="gallery">
            <div class="pillar-container">
                <!-- Prismatic Shard Core -->
                <div class="shard-system">
                    <div class="shard shard-1"></div>
                    <div class="shard shard-2"></div>
                    <div class="shard shard-3"></div>
                    <div class="shard shard-4"></div>
                    <div class="shard shard-5"></div>
                </div>
                <div class="light-beam"></div>
                <div class="pillar-glow"></div>
            </div>


            
            <div class="card"><video src="https://res.cloudinary.com/dojz9uzhe/video/upload/q_auto,f_auto,w_360/video1.mp4" loop playsinline muted preload="auto"></video></div>
            <div class="card"><video src="https://res.cloudinary.com/dojz9uzhe/video/upload/q_auto,f_auto,w_360/video2.mp4" loop playsinline muted preload="auto"></video></div>
            <div class="card"><video src="https://res.cloudinary.com/dojz9uzhe/video/upload/q_auto,f_auto,w_360/video3.mp4" loop playsinline muted preload="auto"></video></div>
            <div class="card"><video src="https://res.cloudinary.com/dojz9uzhe/video/upload/q_auto,f_auto,w_360/video4.mp4" loop playsinline muted preload="auto"></video></div>
            <div class="card"><video src="https://res.cloudinary.com/dojz9uzhe/video/upload/q_auto,f_auto,w_360/video5.mp4" loop playsinline muted preload="auto"></video></div>
            <div class="card"><video src="https://res.cloudinary.com/dojz9uzhe/video/upload/q_auto,f_auto,w_360/video6.mp4" loop playsinline muted preload="auto"></video></div>
            <div class="card"><video src="https://res.cloudinary.com/dojz9uzhe/video/upload/q_auto,f_auto,w_360/video7.mp4" loop playsinline muted preload="auto"></video></div>
            <div class="card"><video src="https://res.cloudinary.com/dojz9uzhe/video/upload/q_auto,f_auto,w_360/video8.mp4" loop playsinline muted preload="auto"></video></div>

        </div>
    </div>


    <div class="scroll-space"></div>

    <script src="script.js"></script>
</body>
</html>
