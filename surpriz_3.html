<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>✨ Sürpriz No3 ✨</title>
    <meta name="language" content="az">
    <meta name="description" content="Sənin üçün üçüncü sürpriz...">
    <link rel="icon" type="image/x-icon" href="https://cdn.jsdelivr.net/gh/sun0225SUN/photos/img/20210715233345.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        .back-to-home {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            color: #ff3366;
            text-decoration: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(255, 51, 102, 0.4);
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.2);
            transition: all 0.3s ease;
            font-weight: 600;
        }
        .back-to-home:hover {
            transform: translateX(-5px);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 6px 20px rgba(255, 51, 102, 0.4);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', 'Tahoma', 'Geneva', 'Verdana', 'Poppins', sans-serif;
            background: #000;
        }

        #info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            pointer-events: none;
            z-index: 10;
            letter-spacing: 2px;
            text-shadow: 0 0 15px #ff1e4d, 0 0 30px #ff4d6d;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 25px;
            border-radius: 50px;
            backdrop-filter: blur(8px);
            white-space: nowrap;
            border: 1px solid rgba(255, 77, 109, 0.4);
            animation: subtlePulse 2.5s infinite alternate;
        }

        @keyframes subtlePulse {
            0% { opacity: 0.7; text-shadow: 0 0 10px #ff1e4d; }
            100% { opacity: 1; text-shadow: 0 0 25px #ff69b4, 0 0 40px #ff3366; }
        }

        @media (max-width: 768px) {
            #info {
                font-size: 12px;
                padding: 6px 16px;
                white-space: nowrap;
            }
        }

        @media (max-width: 480px) {
            #info {
                font-size: 10px;
                padding: 5px 12px;
                bottom: 12px;
            }
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>
    <a href="index.html?from=surprise" class="back-to-home">
        <i class="fas fa-arrow-left"></i>
        <span>Geri</span>
    </a>
    <div id="info">✨ Səni çox sevirəm Fidanım ✨</div>

    <script type="module">
        import * as THREE from 'three';

        // --- Konfiqurasiya ---
        const AD = "FİDAN";
        
        // Səhnə, Kamera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x050505, 0.006);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        function randomRange(min, max) {
            return min + Math.random() * (max - min);
        }

        // --- Mətn texture yaratma ---
        function createTextTexture(message, colorHex, fontSize = 80) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            ctx.font = `bold ${fontSize}px 'Poppins', 'Arial Black', 'Segoe UI Black', sans-serif`;
            const textMetrics = ctx.measureText(message);
            const textWidth = textMetrics.width;
            
            const padding = 70;
            canvas.width = Math.max(800, textWidth + padding * 2);
            canvas.height = fontSize + 120;
            
            ctx.font = `bold ${fontSize}px 'Poppins', 'Arial Black', 'Segoe UI Black', sans-serif`;
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.shadowBlur = 20;
            ctx.shadowColor = colorHex;
            ctx.fillStyle = colorHex;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(message, canvas.width/2, canvas.height/2);
            
            ctx.shadowBlur = 12;
            ctx.fillStyle = "#ffffff";
            ctx.fillText(message, canvas.width/2, canvas.height/2 - 2);
            
            ctx.shadowBlur = 15;
            ctx.fillStyle = colorHex;
            ctx.fillText(message, canvas.width/2, canvas.height/2);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }
        
        // --- Bütün mesajlar tam ---
        const baseMessage = `I LOVE YOU ${AD}`;
        
        const variants = [
            `I LOVE YOU ${AD}`,
            `${AD} 🤍`,
            `I ♥ U ${AD}`,
            `LOVE ${AD}`,
            `MY LOVE ${AD}`,
            `${AD}IM`,
            `${AD} ❤️`,
            `SENİ SEVİREM ${AD}`,
            `${AD} HEYATIM`,
            `BEST LOVE ${AD}`,
            `ÖMRÜM ${AD}`,
            `CANIM ${AD}`,
            `${AD} 💖`
        ];
        
        function ensureFullMessage(msg) {
            if (msg.includes('FİDA') && !msg.includes('FİDAN')) {
                msg = msg.replace('FİDA', 'FİDAN');
            }
            if (!msg.includes('FİDAN') && !msg.includes('FİDA')) {
                msg = `${msg} ${AD}`;
            }
            return msg;
        }
        
        const textsGroup = [];
        const TEXT_COUNT = 120;
        
        for (let i = 0; i < TEXT_COUNT; i++) {
            const scaleVal = randomRange(0.5, 2.0);
            let colorHex;
            const neonColors = ["#ff1e4d", "#ff4d6d", "#ff69b4", "#ff3366", "#ff1493", "#ff66cc", "#ff2a5e"];
            colorHex = neonColors[Math.floor(Math.random() * neonColors.length)];
            
            let msg = Math.random() > 0.3 ? baseMessage : variants[Math.floor(Math.random() * variants.length)];
            msg = ensureFullMessage(msg);
            
            const fontSizeVal = Math.floor(45 + scaleVal * 55);
            const texture = createTextTexture(msg, colorHex, fontSizeVal);
            const material = new THREE.SpriteMaterial({ 
                map: texture, 
                transparent: true, 
                opacity: 0.95, 
                blending: THREE.AdditiveBlending 
            });
            const sprite = new THREE.Sprite(material);
            
            sprite.position.set(randomRange(-8, 8), randomRange(-5, 6), randomRange(-38, 26));
            sprite.scale.set(scaleVal * 2.4, scaleVal * 1.1, 1);
            
            scene.add(sprite);
            
            textsGroup.push({
                mesh: sprite,
                speed: randomRange(0.08, 0.35),
                resetZ: -38,
                maxZ: 28
            });
        }
        
        // --- Ürək effektləri ---
        const hearts = [];
        const HEART_COUNT = 200;
        
        function createHeartTexture(color = "#ff3366") {
            const canvas = document.createElement('canvas');
            canvas.width = 100;
            canvas.height = 100;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 100, 100);
            ctx.fillStyle = color;
            ctx.shadowBlur = 0;
            ctx.beginPath();
            const x = 50, y = 50, size = 38;
            ctx.moveTo(x, y + size/4);
            ctx.bezierCurveTo(x, y - size/2, x - size, y - size/2, x - size/2, y + size/4);
            ctx.bezierCurveTo(x - size/3, y + size/1.8, x, y + size, x, y + size);
            ctx.bezierCurveTo(x, y + size, x + size/3, y + size/1.8, x + size/2, y + size/4);
            ctx.bezierCurveTo(x + size, y - size/2, x, y - size/2, x, y + size/4);
            ctx.fill();
            ctx.fillStyle = color;
            ctx.shadowBlur = 12;
            ctx.shadowColor = color;
            ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }
        
        const heartColors = ["#ff3366", "#ff1e4d", "#ff4d6d", "#ff6699", "#ff1493", "#ff6b6b", "#ff2a5e"];
        
        for (let i = 0; i < HEART_COUNT; i++) {
            const randomColor = heartColors[Math.floor(Math.random() * heartColors.length)];
            const heartTex = createHeartTexture(randomColor);
            const materialHeart = new THREE.SpriteMaterial({ 
                map: heartTex, 
                transparent: true, 
                blending: THREE.AdditiveBlending 
            });
            const heartSprite = new THREE.Sprite(materialHeart);
            const heartScale = randomRange(0.1, 0.6);
            heartSprite.scale.set(heartScale, heartScale, 1);
            heartSprite.position.set(randomRange(-9, 9), randomRange(-5.5, 6.5), randomRange(-45, 35));
            scene.add(heartSprite);
            
            hearts.push({
                mesh: heartSprite,
                speed: randomRange(0.05, 0.25),
                resetZ: -45,
                maxZ: 36,
                originX: heartSprite.position.x,
                originY: heartSprite.position.y,
                time: Math.random() * Math.PI * 2,
                rotationSpeed: randomRange(0.005, 0.03)
            });
        }
        
        // --- Parıldayan ulduzlar ---
        const starCount = 2000;
        const starGeometry = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = randomRange(-30, 30);
            starPositions[i*3+1] = randomRange(-18, 18);
            starPositions[i*3+2] = randomRange(-90, 60);
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ 
            color: 0xffaa99, 
            size: 0.1, 
            transparent: true, 
            opacity: 0.8, 
            blending: THREE.AdditiveBlending 
        });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);
        
        // --- Animasiya ---
        let time = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            time += 0.015;
            
            // Mətnlər
            for (let obj of textsGroup) {
                obj.mesh.position.z += obj.speed;
                
                if (obj.mesh.position.z > obj.maxZ) {
                    obj.mesh.position.z = obj.resetZ;
                    obj.mesh.position.x = randomRange(-8, 8);
                    obj.mesh.position.y = randomRange(-5.2, 6.2);
                    
                    const newScaleVal = randomRange(0.5, 2.0);
                    obj.mesh.scale.set(newScaleVal * 2.4, newScaleVal * 1.1, 1);
                    
                    const neonColors = ["#ff1e4d", "#ff4d6d", "#ff69b4", "#ff3366", "#ff1493", "#ff2a5e"];
                    const newColor = neonColors[Math.floor(Math.random() * neonColors.length)];
                    
                    let newMsg = Math.random() > 0.3 ? baseMessage : variants[Math.floor(Math.random() * variants.length)];
                    newMsg = ensureFullMessage(newMsg);
                    
                    const newFontSize = 45 + Math.floor(newScaleVal * 55);
                    const newTexture = createTextTexture(newMsg, newColor, newFontSize);
                    obj.mesh.material.map = newTexture;
                    obj.mesh.material.needsUpdate = true;
                    obj.speed = randomRange(0.08, 0.35);
                }
            }
            
            // Ürəklər
            for (let heart of hearts) {
                heart.mesh.position.z += heart.speed;
                heart.time += 0.028;
                heart.mesh.position.x = heart.originX + Math.sin(heart.time * 1.6) * 0.08;
                heart.mesh.position.y = heart.originY + Math.cos(heart.time * 1.4) * 0.08;
                heart.mesh.material.rotation = Math.sin(heart.time * heart.rotationSpeed) * 0.4;
                
                if (heart.mesh.position.z > heart.maxZ) {
                    heart.mesh.position.z = heart.resetZ;
                    heart.originX = randomRange(-9, 9);
                    heart.originY = randomRange(-5.8, 6.8);
                    heart.mesh.position.x = heart.originX;
                    heart.mesh.position.y = heart.originY;
                    heart.mesh.scale.set(randomRange(0.1, 0.6), randomRange(0.1, 0.6), 1);
                    heart.speed = randomRange(0.05, 0.25);
                    
                    if (Math.random() > 0.7) {
                        const newCol = heartColors[Math.floor(Math.random() * heartColors.length)];
                        heart.mesh.material.map = createHeartTexture(newCol);
                        heart.mesh.material.needsUpdate = true;
                    }
                }
            }
            
            stars.rotation.y += 0.001;
            stars.rotation.x += 0.0005;
            
            // Kamera nəfəs effekti
            const breath = Math.sin(time * 0.5) * 0.05;
            camera.position.z = 4.65 + breath;
            camera.position.x = Math.sin(time * 0.28) * 0.08;
            camera.position.y = Math.cos(time * 0.3) * 0.06;
            camera.lookAt(0, 0, -3);
            
            renderer.render(scene, camera);
        }
        
        animate();
        
        // Pəncərə ölçüsü dəyişdikdə
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        console.log(`%c💖 ${AD}, SƏNİ ÇOX SEVİRƏM! 💖`, 'color: #ff4d6d; font-size: 18px; font-weight: bold; text-shadow: 0 0 10px #ff3366;');
        console.log('%c✨ Sürpriz No3 - Sonsuz sevgi ilə... ❤️', 'color: #ff99cc; font-size: 14px;');
    </script>
</body>
</html>
