<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sevgililər Günü Sürprizi | I LOVE YOU FİDAN</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', 'Microsoft YaHei', 'Poppins', sans-serif;
        }
        #info {
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            pointer-events: none;
            z-index: 10;
            font-family: monospace;
            letter-spacing: 1px;
            text-shadow: 0 0 5px rgba(255,30,77,0.5);
            background: rgba(0,0,0,0.4);
            display: inline-block;
            width: auto;
            margin: 0 auto;
            padding: 4px 12px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }
        @media (max-width: 600px) {
            #info { font-size: 9px; bottom: 8px; white-space: nowrap; }
        }
    </style>
</head>
<body>
    <div id="info">❤️ Sonsuz sevgi | I LOVE YOU FİDAN ❤️</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- Konfiqurasiya ---
        const AD = "FİDAN";  // Tam ad: FİDAN
        const FULL_NAME = "FİDAN";
        
        // Səhnə, Kamera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.FogExp2(0x000000, 0.007);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 5);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        function randomRange(min, max) {
            return min + Math.random() * (max - min);
        }

        // --- TƏMİR EDİLMİŞ: Mətn texture yaratma (tam görünən, kəsilmə yoxdur) ---
        function createTextTexture(message, colorHex, fontSize = 80, fontFamily = "Arial Black") {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Mətnin uzunluğuna görə dinamik ölçü - heç vaxt kəsilmə olmayacaq
            ctx.font = `${fontSize}px ${fontFamily}`;
            const textMetrics = ctx.measureText(message);
            const textWidth = textMetrics.width;
            
            // Kənar boşluqlar əlavə et (padding)
            const padding = 60;
            canvas.width = Math.max(800, textWidth + padding * 2);
            canvas.height = fontSize + 100;
            
            // Təkrar context təyin et
            ctx.font = `${fontSize}px ${fontFamily}`;
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = colorHex;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowBlur = 15;
            ctx.shadowColor = colorHex;
            ctx.fillText(message, canvas.width/2, canvas.height/2);
            
            ctx.shadowBlur = 8;
            ctx.fillStyle = colorHex;
            ctx.fillText(message, canvas.width/2, canvas.height/2);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.needsUpdate = true;
            return texture;
        }
        
        // --- BÜTÜN MESAJLAR TAM VƏ DÜZGÜN (heç bir yarımçıq ad yoxdur) ---
        const baseMessage = `I LOVE YOU ${AD}`;
        
        // Bütün variantlar - hər birində ad TAM yazılıb
        const variants = [
            `I LOVE YOU ${AD}`,
            `${AD} 🤍`,
            `I ♥ U ${AD}`,
            `LOVE ${AD}`,
            `MY LOVE ${AD}`,
            `${AD}IM`,
            `SEVİRAM ${AD}`,
            `I LOVE YOU ${AD} FOREVER`,
            `${AD} ❤️❤️❤️`,
            `SENİ SEVİREM ${AD}`,
            `${AD} HEYATIM`,
            `I LOVE YOU MY ${AD}`,
            `BEST LOVE ${AD}`,
            `LOVE ${AD} 🤍`,
            `CANIM ${AD}`,
            `BİR DANƏ ${AD}`,
            `ÖMRÜM ${AD}`
        ];
        
        // Təhlükəsizlik funksiyası - mesajın tam olduğunu təmin edir
        function ensureFullMessage(msg) {
            // Əgər mesajda "FİDA" varsa və "FİDAN" deyilsə, düzəlt
            if (msg.includes('FİDA') && !msg.includes('FİDAN')) {
                msg = msg.replace('FİDA', 'FİDAN');
            }
            // Əgər mesajda "FIDA" (böyük) varsa düzəlt
            if (msg.includes('FIDA') && !msg.includes('FİDAN')) {
                msg = msg.replace('FIDA', 'FİDAN');
            }
            // Əgər mesajda ad ümumiyyətlə yoxdursa, əlavə et
            if (!msg.includes('FİDAN') && !msg.includes('FİDAN') && msg.length < 15) {
                msg = `${msg} ${AD}`;
            }
            return msg;
        }
        
        const textsGroup = [];
        const TEXT_COUNT = 130; // Daha sıx görünüş
        
        for (let i = 0; i < TEXT_COUNT; i++) {
            const scaleVal = randomRange(0.55, 2.2);
            let colorHex;
            const colorType = Math.random();
            if (colorType < 0.7) {
                const neonColors = ["#ff1e4d", "#ff4d6d", "#ff69b4", "#ff3366", "#ff1493", "#ff66cc", "#ff2a5e"];
                colorHex = neonColors[Math.floor(Math.random() * neonColors.length)];
            } else {
                colorHex = "#ffffff";
            }
            
            // Mesaj seçimi - HƏMİŞƏ TAM
            let msg;
            if (Math.random() > 0.25) {
                msg = baseMessage;
            } else {
                msg = variants[Math.floor(Math.random() * variants.length)];
            }
            
            // Təhlükəsizlik yoxlaması
            msg = ensureFullMessage(msg);
            
            const fontSizeVal = Math.floor(45 + scaleVal * 55);
            const texture = createTextTexture(msg, colorHex, fontSizeVal, "Poppins, 'Arial Black', 'Segoe UI Black'");
            const material = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.96, blending: THREE.AdditiveBlending });
            const sprite = new THREE.Sprite(material);
            
            const posX = randomRange(-8, 8);
            const posY = randomRange(-5, 6);
            const posZ = randomRange(-38, 26);
            sprite.position.set(posX, posY, posZ);
            sprite.scale.set(scaleVal * 2.4, scaleVal * 1.1, 1);
            
            scene.add(sprite);
            
            const speed = randomRange(0.08, 0.38);
            
            textsGroup.push({
                mesh: sprite,
                speed: speed,
                resetZ: -38,
                maxZ: 28,
                originalScale: sprite.scale.clone()
            });
        }
        
        // --- Ürək effektləri ---
        const hearts = [];
        const HEART_COUNT = 220;
        
        function createHeartTexture(color = "#ff3366") {
            const canvas = document.createElement('canvas');
            canvas.width = 100;
            canvas.height = 100;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 100, 100);
            ctx.fillStyle = color;
            ctx.shadowBlur = 0;
            ctx.beginPath();
            const x = 50, y = 50, size = 38;
            ctx.moveTo(x, y + size/4);
            ctx.bezierCurveTo(x, y - size/2, x - size, y - size/2, x - size/2, y + size/4);
            ctx.bezierCurveTo(x - size/3, y + size/1.8, x, y + size, x, y + size);
            ctx.bezierCurveTo(x, y + size, x + size/3, y + size/1.8, x + size/2, y + size/4);
            ctx.bezierCurveTo(x + size, y - size/2, x, y - size/2, x, y + size/4);
            ctx.fill();
            ctx.fillStyle = color;
            ctx.shadowBlur = 12;
            ctx.shadowColor = color;
            ctx.fill();
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }
        
        const heartColors = ["#ff3366", "#ff1e4d", "#ff4d6d", "#ff6699", "#ff1493", "#ff6b6b", "#ff2a5e", "#ff5e7e", "#ff88aa"];
        
        for (let i = 0; i < HEART_COUNT; i++) {
            const randomColor = heartColors[Math.floor(Math.random() * heartColors.length)];
            const heartTex = createHeartTexture(randomColor);
            const materialHeart = new THREE.SpriteMaterial({ map: heartTex, transparent: true, blending: THREE.AdditiveBlending });
            const heartSprite = new THREE.Sprite(materialHeart);
            const heartScale = randomRange(0.12, 0.7);
            heartSprite.scale.set(heartScale, heartScale, 1);
            const posX = randomRange(-9, 9);
            const posY = randomRange(-5.5, 6.5);
            const posZ = randomRange(-45, 35);
            heartSprite.position.set(posX, posY, posZ);
            scene.add(heartSprite);
            
            hearts.push({
                mesh: heartSprite,
                speed: randomRange(0.05, 0.28),
                resetZ: -45,
                maxZ: 36,
                originX: posX,
                originY: posY,
                time: Math.random() * Math.PI * 2,
                rotationSpeed: randomRange(0.005, 0.03)
            });
        }
        
        // --- Parıldayan hissəciklər ---
        const starCount = 1800;
        const starGeometry = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = randomRange(-26, 26);
            starPositions[i*3+1] = randomRange(-16, 16);
            starPositions[i*3+2] = randomRange(-85, 55);
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xffaa99, size: 0.09, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);
        
        const dustCount = 1200;
        const dustGeometry = new THREE.BufferGeometry();
        const dustPositions = new Float32Array(dustCount * 3);
        for (let i = 0; i < dustCount; i++) {
            dustPositions[i*3] = randomRange(-11, 11);
            dustPositions[i*3+1] = randomRange(-7, 8);
            dustPositions[i*3+2] = randomRange(-60, 50);
        }
        dustGeometry.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
        const dustMaterial = new THREE.PointsMaterial({ color: 0xff6699, size: 0.07, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
        const dustParticles = new THREE.Points(dustGeometry, dustMaterial);
        scene.add(dustParticles);
        
        // --- Animasiya ---
        let time = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            time += 0.015;
            
            // Mətnləri hərəkət etdir
            for (let obj of textsGroup) {
                obj.mesh.position.z += obj.speed;
                
                if (obj.mesh.position.z > obj.maxZ) {
                    obj.mesh.position.z = obj.resetZ;
                    obj.mesh.position.x = randomRange(-8, 8);
                    obj.mesh.position.y = randomRange(-5.2, 6.2);
                    
                    const newScaleVal = randomRange(0.55, 2.3);
                    obj.mesh.scale.set(newScaleVal * 2.4, newScaleVal * 1.1, 1);
                    
                    const newIsNeon = Math.random() > 0.35;
                    let newColor;
                    if (newIsNeon) {
                        const neonOpts = ["#ff1e4d", "#ff4d6d", "#ff69b4", "#ff3366", "#ff1493", "#ff2a5e"];
                        newColor = neonOpts[Math.floor(Math.random() * neonOpts.length)];
                    } else {
                        newColor = "#ffffff";
                    }
                    
                    // YENİ MƏTN - HƏMİŞƏ TAM
                    let newMsg;
                    if (Math.random() > 0.2) {
                        newMsg = `I LOVE YOU ${AD}`;
                    } else {
                        newMsg = variants[Math.floor(Math.random() * variants.length)];
                    }
                    
                    // Təhlükəsizlik yoxlaması
                    newMsg = ensureFullMessage(newMsg);
                    
                    const newFontSize = 45 + Math.floor(newScaleVal * 55);
                    const newTexture = createTextTexture(newMsg, newColor, newFontSize, "Poppins, 'Arial Black'");
                    obj.mesh.material.map = newTexture;
                    obj.mesh.material.needsUpdate = true;
                    obj.speed = randomRange(0.08, 0.38);
                }
            }
            
            // Ürəkləri hərəkət etdir
            for (let heart of hearts) {
                heart.mesh.position.z += heart.speed;
                heart.time += 0.028;
                const offsetX = Math.sin(heart.time * 1.6) * 0.06;
                const offsetY = Math.cos(heart.time * 1.4) * 0.06;
                heart.mesh.position.x = heart.originX + offsetX;
                heart.mesh.position.y = heart.originY + offsetY;
                heart.mesh.material.rotation = Math.sin(heart.time * heart.rotationSpeed) * 0.4;
                
                if (heart.mesh.position.z > heart.maxZ) {
                    heart.mesh.position.z = heart.resetZ;
                    heart.originX = randomRange(-9, 9);
                    heart.originY = randomRange(-5.8, 6.8);
                    heart.mesh.position.x = heart.originX;
                    heart.mesh.position.y = heart.originY;
                    const newScale = randomRange(0.12, 0.7);
                    heart.mesh.scale.set(newScale, newScale, 1);
                    heart.speed = randomRange(0.05, 0.28);
                    
                    if (Math.random() > 0.7) {
                        const newCol = heartColors[Math.floor(Math.random() * heartColors.length)];
                        const newTex = createHeartTexture(newCol);
                        heart.mesh.material.map = newTex;
                        heart.mesh.material.needsUpdate = true;
                    }
                }
            }
            
            stars.rotation.y += 0.001;
            stars.rotation.x += 0.0006;
            dustParticles.rotation.z += 0.0007;
            dustParticles.rotation.y += 0.0005;
            
            const breath = Math.sin(time * 0.5) * 0.05;
            camera.position.z = 4.65 + breath;
            camera.position.x = Math.sin(time * 0.28) * 0.09;
            camera.position.y = Math.cos(time * 0.3) * 0.08;
            camera.lookAt(0, 0, -3);
            
            renderer.render(scene, camera);
        }
        
        animate();
        
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        console.log(`%c💖 SEVGİLİLƏR GÜNÜ MÜBARƏK, ${AD}! 💖`, 'color: #ff4d6d; font-size: 16px; font-weight: bold;');
        console.log(`%c✨ Bütün sözlər tam və düzgün yazılmışdır. Sonsuz sevgi səninlə... ❤️`, 'color: #ff99cc; font-size: 14px;');
        
        const style = document.createElement('style');
        style.textContent = `
            @keyframes subtlePulse {
                0% { opacity: 0.6; }
                100% { opacity: 1; }
            }
            #info {
                animation: subtlePulse 2s infinite alternate;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
